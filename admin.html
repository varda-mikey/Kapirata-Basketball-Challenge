<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#b5161b"
  >

  <title>
    Kapirata Admin Dashboard
  </title>

  <link
    rel="stylesheet"
    href="admin.css"
  >

</head>


<body>


<header class="topbar">

  <div>

    <small>
      🏴‍☠️ PIRATES' CAFETERIA
    </small>

    <h1>
      Kapirata Admin
    </h1>

    <p>
      Basketball Challenge Monitoring
    </p>

  </div>


  <div class="top-actions">

    <button
      id="refreshBtn"
      class="btn yellow"
    >
      ↻ Refresh
    </button>


    <a
      class="btn dark"
      href="index.html"
      target="_blank"
      rel="noopener"
    >
      Open Game ↗
    </a>

  </div>

</header>



<main class="dashboard">


  <!-- ==================================================
       SUMMARY
  =================================================== -->

  <section class="stats">

    <div class="stat-card">

      <span id="totalCount">
        0
      </span>

      <small>
        TOTAL ATTEMPTS
      </small>

    </div>


    <div class="stat-card">

      <span id="approvedCount">
        0
      </span>

      <small>
        SUCCESSFUL SHOTS
      </small>

    </div>


    <div class="stat-card">

      <span id="availableCount">
        0
      </span>

      <small>
        AVAILABLE VOUCHERS
      </small>

    </div>


    <div class="stat-card">

      <span id="redeemedCount">
        0
      </span>

      <small>
        REDEEMED
      </small>

    </div>


    <div class="stat-card">

      <span id="claimPhotoCount">
        0
      </span>

      <small>
        CLAIM PHOTOS
      </small>

    </div>

  </section>



  <!-- ==================================================
       SEARCH / FILTER
  =================================================== -->

  <section class="toolbar">

    <input
      id="search"
      type="search"
      placeholder="Search student, receipt or voucher..."
    >


    <select id="filter">

      <option value="all">
        All attempts
      </option>

      <option value="approved">
        Successful shot
      </option>

      <option value="pending_cashier">
        Pending cashier
      </option>

      <option value="missed">
        Missed
      </option>

      <option value="cashier_rejected">
        Invalid / Rejected
      </option>

      <option value="available">
        Voucher available
      </option>

      <option value="redeemed">
        Voucher redeemed
      </option>

      <option value="expired">
        Voucher expired
      </option>

    </select>

  </section>



  <!-- ==================================================
       CONNECTION STATUS
  =================================================== -->

  <section
    id="statusBox"
    class="notice"
  >
    Connecting to Firebase...
  </section>



  <!-- ==================================================
       DESKTOP TABLE
  =================================================== -->

  <section class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>
            Student
          </th>

          <th>
            Receipt
          </th>

          <th>
            Result
          </th>

          <th>
            Voucher
          </th>

          <th>
            Evidence
          </th>

          <th>
            Date
          </th>

        </tr>

      </thead>


      <tbody
        id="attemptRows"
      >
      </tbody>

    </table>

  </section>



  <!-- ==================================================
       MOBILE CARDS
  =================================================== -->

  <section
    id="mobileCards"
    class="mobile-cards"
  >
  </section>


</main>



<script
  type="module"
  src="admin.js"
></script>


</body>

</html>
