<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#b5161b" />

  <title>Kapirata Admin Dashboard</title>

  <link rel="stylesheet" href="admin.css" />
</head>

<body>

<header class="topbar">

  <div>
    <small>PIRATES' CAFETERIA</small>

    <h1>
      Kapirata Admin
    </h1>

    <p>
      Basketball Challenge Dashboard
    </p>
  </div>


  <div class="top-actions">

    <button
      id="refreshBtn"
      class="btn yellow"
    >
      ↻ Refresh
    </button>

    <a
      class="btn dark"
      href="index.html"
    >
      Open Game ↗
    </a>

  </div>

</header>


<main class="dashboard">


  <!-- SUMMARY -->

  <section class="stats">

    <div class="stat-card">
      <span id="totalCount">
        0
      </span>

      <small>
        TOTAL ATTEMPTS
      </small>
    </div>


    <div class="stat-card">
      <span id="approvedCount">
        0
      </span>

      <small>
        SUCCESSFUL
      </small>
    </div>


    <div class="stat-card">
      <span id="availableCount">
        0
      </span>

      <small>
        AVAILABLE VOUCHERS
      </small>
    </div>


    <div class="stat-card">
      <span id="redeemedCount">
        0
      </span>

      <small>
        REDEEMED
      </small>
    </div>

  </section>


  <!-- CONTROLS -->

  <section class="toolbar">

    <input
      id="search"
      type="search"
      placeholder="Search name, receipt, voucher..."
    />


    <select id="filter">

      <option value="all">
        All attempts
      </option>

      <option value="approved">
        Successful
      </option>

      <option value="pending_cashier">
        Pending cashier
      </option>

      <option value="missed">
        Missed
      </option>

      <option value="cashier_rejected">
        Cashier rejected
      </option>

      <option value="available">
        Available voucher
      </option>

      <option value="redeemed">
        Redeemed voucher
      </option>

      <option value="expired">
        Expired voucher
      </option>

    </select>

  </section>


  <!-- STATUS -->

  <section
    id="statusBox"
    class="notice"
  >
    Connecting to Firebase...
  </section>


  <!-- DESKTOP TABLE -->

  <section class="table-wrap">

    <table>

      <thead>

        <tr>

          <th>
            Student
          </th>

          <th>
            Receipt
          </th>

          <th>
            Result
          </th>

          <th>
            Voucher
          </th>

          <th>
            Media
          </th>

          <th>
            Date
          </th>

        </tr>

      </thead>


      <tbody
        id="attemptRows"
      ></tbody>

    </table>

  </section>


  <!-- MOBILE CARDS -->

  <section
    id="mobileCards"
    class="mobile-cards"
  ></section>


</main>


<script
  type="module"
  src="admin.js"
></script>

</body>
</html>
